[package]
name = "learnlayer"
version = "0.1.0"
description = "LearnLayer desktop (Windows, and macOS in progress)"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "learnlayer_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The Mac's native side (macos-native/, Swift) is built and linked by build.rs on macOS only.
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.7", features = ["build"] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[target.'cfg(windows)'.dependencies]
# The version Tauri itself already uses (Cargo.lock), with the parts Alt-click needs: hooks, UI Automation, the
# window's picture, the OCR.
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
window-vibrancy = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# A see-through stage and pill need a transparent webview, which on macOS is behind Tauri's private-API switch
# (`macOSPrivateApi` in tauri.macos.conf.json). The app is not for the Mac App Store, where that would matter.
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
window-vibrancy = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
