[package]
name = "learnlayer"
version = "0.1.0"
description = "LearnLayer for Windows"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "learnlayer_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
